name: Diagnose Bedrock port

on:
  push:
    branches:
      - bedrock-26.45-port
    paths:
      - .github/workflows/diagnose-bedrock-port.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bedrock-26.45-port

      - name: Setup PMMP PHP
        uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: './bin'
          pm-version-major: 5

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Install PHP-CS-Fixer
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: 8.3
          tools: php-cs-fixer:3.75

      - name: Apply code style fixes
        run: php-cs-fixer fix

      - name: Capture PHPStan findings
        shell: bash
        run: |
          set +e
          ./vendor/bin/phpstan analyze --no-progress --memory-limit=2G --error-format=raw > PHPSTAN_PORT_REPORT.txt 2>&1
          status=$?
          echo "PHPStan exit code: $status" >> PHPSTAN_PORT_REPORT.txt
          exit 0

      - name: Commit diagnostics and style fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed'
            exit 0
          fi
          git commit -m 'Apply port code style fixes and capture PHPStan findings'
          git push origin HEAD:bedrock-26.45-port
