name: Port Bedrock 26.45 support

on:
  push:
    branches:
      - bedrock-26.45-port
    paths:
      - .github/workflows/port-bedrock-26.45.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: bedrock-26.45-port
          fetch-depth: 0

      - name: Fetch tested Bedrock 1.26.45 implementation
        run: |
          git clone https://github.com/SyntaxStudiosRE/PocketMine-MP.git /tmp/pmmp-26.45
          cd /tmp/pmmp-26.45
          git checkout 70d6ca99be6fc29f10af9e7ce4b2ca865e139108
          test "$(git rev-parse HEAD)" = "70d6ca99be6fc29f10af9e7ce4b2ca865e139108"

      - name: Port runtime source
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/pmmp-26.45/ ./

      - name: Record port provenance
        run: |
          cat > BEDROCK_PORT.md <<'EOF'
          # Bedrock 1.26.45 port

          This branch updates the archived PMMP codebase to Minecraft Bedrock 1.26.45
          (display version v26.45), protocol 2169.

          The protocol/runtime implementation is based on the public
          SyntaxStudiosRE/NetherGamesMC continuation of PocketMine-MP and is pinned to
          SyntaxStudiosRE/PocketMine-MP commit
          `70d6ca99be6fc29f10af9e7ce4b2ca865e139108` for reproducibility.

          PocketMine-MP remains LGPL-3.0 licensed. Original PMMP, NetherGamesMC and
          SyntaxStudiosRE attribution and copyright notices are preserved.
          EOF

      - name: Verify Bedrock target
        run: |
          grep -q 'PROTOCOL_1_26_45 = 2169' src/network/mcpe/protocol/ProtocolInfo.php
          grep -q 'CURRENT_PROTOCOL = self::PROTOCOL_1_26_45' src/network/mcpe/protocol/ProtocolInfo.php
          grep -q "MINECRAFT_VERSION = 'v26.45'" src/network/mcpe/protocol/ProtocolInfo.php
          grep -q "MINECRAFT_VERSION_NETWORK = '1.26.45'" src/network/mcpe/protocol/ProtocolInfo.php
          grep -q 'ProtocolInfo::PROTOCOL_1_26_45' src/network/mcpe/convert/ItemTranslator.php
          grep -q 'ProtocolInfo::PROTOCOL_1_26_45' src/network/mcpe/convert/BlockTranslator.php
          grep -q 'ProtocolInfo::PROTOCOL_1_26_45' src/network/mcpe/convert/ItemTypeDictionaryFromDataHelper.php

      - name: PHP syntax checks
        run: |
          php -l src/network/mcpe/protocol/ProtocolInfo.php
          php -l src/network/mcpe/convert/ItemTranslator.php
          php -l src/network/mcpe/convert/BlockTranslator.php
          php -l src/network/mcpe/convert/ItemTypeDictionaryFromDataHelper.php
          php -l src/VersionInfo.php

      - name: Commit port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Port PocketMine-MP to Bedrock 1.26.45 protocol 2169"
          git push origin HEAD:bedrock-26.45-port
